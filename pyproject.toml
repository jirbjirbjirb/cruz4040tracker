[project]
name = "cruz4040"
version = "0.1.0"
description = "Retrospective Monte Carlo of Oneil Cruz's 2026 40/40 chances"
readme = "README.md"
authors = [
    { name = "Kirby Jayes", email = "rkjayes@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlb-statsapi>=1.9.0",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
]

[project.scripts]
ingest = "cruz4040.ingest:main"
build = "cruz4040.build:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
